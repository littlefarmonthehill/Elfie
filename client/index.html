<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>PlanetBrick - LEGO Business Operations</title>
    <meta name="description" content="Professional operations and strategy dashboard for PlanetBrick LEGO business management" />
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlanetBrick" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #000000 0%, #0a0a1a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 0;
        animation: fadeInOut 3s ease-in-out;
        animation-fill-mode: forwards;
      }
      
      #app-loader.hidden {
        animation: fadeOut 0.5s ease-out forwards;
      }
      
      @keyframes fadeInOut {
        0% { opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { opacity: 0; }
      }
      
      @keyframes fadeOut {
        to { opacity: 0; }
      }
      
      .loader-logo {
        width: 256px;
        height: 256px;
        margin-bottom: 24px;
        object-fit: contain;
        animation: pulse 2s ease-in-out infinite;
      }
      
      /* iPad mini (768px width) */
      @media only screen and (min-width: 768px) and (max-width: 820px) {
        .loader-logo {
          width: 320px;
          height: 320px;
        }
      }
      
      /* iPad (1024px width and larger tablets) */
      @media only screen and (min-width: 821px) {
        .loader-logo {
          width: 384px;
          height: 384px;
        }
      }
      
      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(59, 130, 246, 0.1);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      
      .loader-message {
        color: #64748b;
        font-size: 12px;
        font-family: 'Inter', sans-serif;
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      .loader-orbs {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        opacity: 0.3;
      }
      
      .orb {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.8) 0%, rgba(59, 130, 246, 0) 70%);
        animation: float 6s ease-in-out infinite;
      }
      
      .orb-1 {
        width: 120px;
        height: 120px;
        top: 20%;
        left: 10%;
        animation-delay: 0s;
      }
      
      .orb-2 {
        width: 80px;
        height: 80px;
        top: 60%;
        right: 15%;
        animation-delay: 2s;
      }
      
      .orb-3 {
        width: 100px;
        height: 100px;
        bottom: 25%;
        left: 20%;
        animation-delay: 4s;
      }
      
      @keyframes float {
        0%, 100% {
          transform: translate(0, 0) scale(1);
          opacity: 0.3;
        }
        50% {
          transform: translate(30px, -30px) scale(1.1);
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="loader-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>
      <img src="/planetbrick-logo.png" alt="PlanetBrick" class="loader-logo" />
      <div class="loader-spinner"></div>
      <div class="loader-message" id="loader-message">Initializing application...</div>
    </div>
    <div id="root"></div>
    <script>
      // Hide loader when app is ready (minimum 3 seconds)
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('app-loader');
          const message = document.getElementById('loader-message');
          
          // Update message before hiding
          message.textContent = 'Loading complete';
          
          setTimeout(() => {
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 300);
          }, 300);
        }, 3000); // Minimum 3 seconds display time
      });
      
      // Update loading message over time
      let messageIndex = 0;
      const messages = [
        'Initializing application...',
        'Loading modules...',
        'Connecting to services...',
        'Almost ready...'
      ];
      
      const updateMessage = () => {
        const message = document.getElementById('loader-message');
        if (message && messageIndex < messages.length - 1) {
          messageIndex++;
          message.textContent = messages[messageIndex];
        }
      };
      
      setInterval(updateMessage, 800);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
